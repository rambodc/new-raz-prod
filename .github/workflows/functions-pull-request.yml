name: Pull request — Functions validation
on:
  pull_request:
    branches: [production]
    paths: ["functions/**", "firebase.json", ".github/workflows/functions-pull-request.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - run: npm run lint --prefix functions && npm test --prefix functions
