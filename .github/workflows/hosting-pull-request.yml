name: Pull request — Hosting preview
on:
  pull_request:
    branches: [production]
    paths: ["src/**", "public/**", "index.html", "package.json", "package-lock.json", "vite.config.ts", "firebase.json", ".github/workflows/hosting-pull-request.yml"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: hosting-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    environment: Preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Firebase web app
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }}" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ vars.FIREBASE_AUTH_DOMAIN }}" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_PROJECT_ID=new-raz-prod" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }}" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
      - run: npm ci
      - run: npm run lint && npm test && npm run build
      - run: npm install --global firebase-tools@14.15.2
      - name: Deploy pull request preview
        if: github.event_name == 'pull_request'
        run: firebase hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" --project new-raz-prod --non-interactive --expires 7d
