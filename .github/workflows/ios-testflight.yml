name: iOS TestFlight

# Manual only. Uploads a beta build for ca.razzberry.app. It does not submit for App Store review
# and it does not release anything publicly.
on:
  workflow_dispatch:
    inputs:
      asc_app_id:
        description: Numeric App Store Connect id for ca.razzberry.app
        required: true
        default: "6832082405"
        type: string
      confirm:
        description: Type testflight-only. Anything else refuses the run.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  refused:
    if: inputs.confirm != 'testflight-only'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse
        run: |
          echo "Confirmation was not testflight-only. No upload and no App Store submission were started."
          exit 1

  upload:
    if: inputs.confirm == 'testflight-only'
    runs-on: macos-26
    environment: Prod
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure the public web app
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }}" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ vars.FIREBASE_AUTH_DOMAIN }}" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_PROJECT_ID=new-raz-prod" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }}" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}" >> "$GITHUB_ENV"
      - name: Require the public web config
        run: |
          test -n "$VITE_FIREBASE_API_KEY" && test -n "$VITE_FIREBASE_AUTH_DOMAIN" && test -n "$VITE_FIREBASE_APP_ID"
          echo "Public web config is present. Values are not printed."
      - name: Reject a non-numeric app id before any signing
        env:
          ASC_APP_ID: ${{ inputs.asc_app_id }}
        run: |
          case "$ASC_APP_ID" in
            ''|*[!0-9]*) echo "asc_app_id must be the numeric Apple id, not a bundle id."; exit 1 ;;
          esac
          if [ "$ASC_APP_ID" != "6832082405" ]; then
            echo "Refusing unexpected app id $ASC_APP_ID. Razzberry's record is 6832082405."
            exit 1
          fi
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build
      - run: npx cap sync ios
      - name: Install CocoaPods when the project uses them
        working-directory: ios/App
        run: |
          if [ -f Podfile ]; then
            pod install
          fi
      - name: Archive with the Razzberry distribution profile
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: bash scripts/ios/archive.sh
      - name: Upload to TestFlight and poll processing
        env:
          ASC_APP_ID: ${{ inputs.asc_app_id }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IPA_PATH: ios/App/output/Razzberry.ipa
        run: python3 scripts/ios/upload_testflight.py
