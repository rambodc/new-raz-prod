name: Production — Firebase Hosting

# Deploys only the website. Triggered by frontend files; functions and rules changes never run this.
on:
  push:
    branches: [production]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "firebase.json"
      - ".github/workflows/hosting-merge.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hosting-production
  cancel-in-progress: false

env:
  FIREBASE_TOOLS_VERSION: 15.22.1

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate deployment settings
        run: |
          for v in GCP_WIF_PROVIDER GCP_SERVICE_ACCOUNT_EMAIL FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_APP_ID; do
            case "$v" in
              GCP_WIF_PROVIDER) val="${{ vars.GCP_WIF_PROVIDER }}" ;;
              GCP_SERVICE_ACCOUNT_EMAIL) val="${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}" ;;
              FIREBASE_API_KEY) val="${{ vars.FIREBASE_API_KEY }}" ;;
              FIREBASE_AUTH_DOMAIN) val="${{ vars.FIREBASE_AUTH_DOMAIN }}" ;;
              FIREBASE_APP_ID) val="${{ vars.FIREBASE_APP_ID }}" ;;
            esac
            test -n "$val" || { echo "Missing Prod variable $v"; exit 1; }
          done
      - name: Configure Firebase web app
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }}" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ vars.FIREBASE_AUTH_DOMAIN }}" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_PROJECT_ID=new-raz-prod" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }}" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
      - run: npm ci --prefer-offline --no-audit --no-fund
      # Lint and tests already passed on the pull request (required check); here we only build.
      - run: npm run build
      - name: Cache Firebase CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: firebase-tools-${{ env.FIREBASE_TOOLS_VERSION }}-${{ runner.os }}
      - run: npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} deploy --only hosting --project new-raz-prod --non-interactive --message "CI hosting deploy"
