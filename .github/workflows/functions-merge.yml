name: Production — Firebase Functions
on:
  push:
    branches: [production]
    paths: ["functions/**", "firebase.json", ".firebaserc", ".github/workflows/functions-merge.yml"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: functions-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Validate deployment identity
        run: |
          test -n "${{ vars.GCP_WIF_PROVIDER }}" || { echo "Missing Prod variable GCP_WIF_PROVIDER"; exit 1; }
          test -n "${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}" || { echo "Missing Prod variable GCP_SERVICE_ACCOUNT_EMAIL"; exit 1; }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
      - name: Validate OpenAI secret exists
        run: gcloud secrets versions describe latest --secret=OPENAI_API_KEY2 --project=new-raz-prod --format='value(state)' | grep -qx ENABLED || { echo "Add an enabled OPENAI_API_KEY2 version to Secret Manager before deploying chat functions"; exit 1; }
      - run: npm ci --prefix functions
      - run: npm run lint --prefix functions && npm test --prefix functions
      - run: npm install --global firebase-tools@15.22.1
      - run: firebase deploy --only functions --project new-raz-prod --non-interactive --message "CI functions deploy"
