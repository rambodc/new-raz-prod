name: Pull request validation

# One workflow, three jobs. The job names are the required status checks on `production`
# (hosting-validation, functions-validation, rules-validation), so every job reports on every
# pull request. Each job first looks at which files the PR touches and only does the heavy work
# (install, lint, tests, build) when its area changed; otherwise it finishes in seconds and passes.
on:
  pull_request:
    branches: [production]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FIREBASE_TOOLS_VERSION: 15.22.1

jobs:
  hosting-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Did the frontend change?
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PATTERN: '^(src/|public/|index\.html$|package\.json$|package-lock\.json$|vite\.config\.ts$|vitest\.config\.ts$|tsconfig[^/]*\.json$|eslint\.config\.mjs$|firebase\.json$|\.github/workflows/pull-request\.yml$)'
        run: |
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          if echo "$files" | grep -Eq "$PATTERN"; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "No frontend changes, nothing to validate."; fi
      - uses: actions/checkout@v4
        if: steps.changes.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Configure Firebase web app
        if: steps.changes.outputs.run == 'true'
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }}" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ vars.FIREBASE_AUTH_DOMAIN }}" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_PROJECT_ID=new-raz-prod" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }}" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}" >> "$GITHUB_ENV"
      - if: steps.changes.outputs.run == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - if: steps.changes.outputs.run == 'true'
        run: npm run lint && npm test && npm run build

  functions-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Did the functions change?
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PATTERN: '^(functions/|firebase\.json$|\.github/workflows/pull-request\.yml$)'
        run: |
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          if echo "$files" | grep -Eq "$PATTERN"; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "No functions changes, nothing to validate."; fi
      - uses: actions/checkout@v4
        if: steps.changes.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - if: steps.changes.outputs.run == 'true'
        run: npm ci --prefix functions --prefer-offline --no-audit --no-fund
      - if: steps.changes.outputs.run == 'true'
        run: npm run lint --prefix functions && npm test --prefix functions

  rules-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Did the rules change?
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PATTERN: '^(firestore\.rules$|storage\.rules$|firestore\.indexes\.json$|tests/|firebase\.json$|package\.json$|package-lock\.json$|\.github/workflows/pull-request\.yml$)'
        run: |
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          if echo "$files" | grep -Eq "$PATTERN"; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "No rules changes, nothing to validate."; fi
      - uses: actions/checkout@v4
        if: steps.changes.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        if: steps.changes.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Firebase CLI and emulators
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm/_npx
            ~/.cache/firebase/emulators
          key: firebase-tools-${{ env.FIREBASE_TOOLS_VERSION }}-${{ runner.os }}
      - if: steps.changes.outputs.run == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Test Firestore and Storage rules
        if: steps.changes.outputs.run == 'true'
        run: npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} emulators:exec --only firestore,storage --project demo-razzberry-rules "node --test tests/rules.test.mjs"
